    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6B7C8F"/></marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2F75B5"/></marker>
    <style>
      text{font-family:Arial,Helvetica,sans-serif;fill:#1D2733}
      .title{font-size:34px;font-weight:700;fill:#17365D}
      .subtitle{font-size:18px;fill:#536273}
      .boxTitle{font-size:20px;font-weight:700}
