  <rect width="2100" height="1420" fill="#F7FAFC"/>
  <text x="1050" y="52" text-anchor="middle" class="title">SERVI-RED - Secuencia de Reporte de Corte</text>
  <text x="1050" y="82" text-anchor="middle" class="subtitle">Flujo crítico y efectos desacoplados</text><g>
    <rect x="10" y="120" width="180" height="75" rx="8" fill="#FFFFFF" stroke="#2F75B5" stroke-width="2"/>
    <text x="100" y="164.5" text-anchor="middle" class="boxTitle" fill="#17365D">Ciudadano</text>
    
  </g><line x1="100" y1="195" x2="100" y2="1305" stroke="#6B7C8F" stroke-width="1.5" stroke-dasharray="7 7"/><g>
    <rect x="240" y="120" width="180" height="75" rx="8" fill="#FFFFFF" stroke="#2F75B5" stroke-width="2"/>
    <text x="330" y="164.5" text-anchor="middle" class="boxTitle" fill="#17365D">Canal móvil</text>
    
  </g><line x1="330" y1="195" x2="330" y2="1305" stroke="#6B7C8F" stroke-width="1.5" stroke-dasharray="7 7"/><g>
