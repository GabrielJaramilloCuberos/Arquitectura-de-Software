<svg xmlns="http://www.w3.org/2000/svg" width="2100" height="1420" viewBox="0 0 2100 1420"><defs><style>.t{font:700 34px Arial;fill:#173a64}.s{font:18px Arial;fill:#52677e}.h{font:700 17px Arial;fill:#1f2937}.p{font:14px Arial;fill:#334155}.head{fill:#fff;stroke:#2876c7;stroke-width:2}.core{fill:#dcecf9;stroke:#173a64;stroke-width:2}.data{fill:#eee6f5;stroke:#76509a;stroke-width:2}.infra{fill:#e2f2e9;stroke:#34845d;stroke-width:2}.life{stroke:#7890aa;stroke-width:1.5;stroke-dasharray:7 7}.a{stroke:#2876c7;stroke-width:2.5;fill:none;marker-end:url(#m)}.r{stroke:#667f99;stroke-width:2;stroke-dasharray:7 6;fill:none;marker-end:url(#mr)}.g{stroke:#34845d;stroke-width:2.5;fill:none;marker-end:url(#mg)}</style><marker id="m" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L9 3 0 6Z" fill="#2876c7"/></marker><marker id="mr" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L9 3 0 6Z" fill="#667f99"/></marker><marker id="mg" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L9 3 0 6Z" fill="#34845d"/></marker></defs><rect width="2100" height="1420" fill="#f7fafc"/><text x="1050" y="52" text-anchor="middle" class="t">SERVI-RED - Secuencia de Registro de un Corte</text><text x="1050" y="84" text-anchor="middle" class="s">Flujo síncrono HTTP/REST y procesamiento asíncrono mediante RabbitMQ</text>
<g><rect x="25" y="120" width="185" height="75" rx="8" class="head"/><text x="117" y="164" text-anchor="middle" class="h">Ciudadano</text><rect x="250" y="120" width="185" height="75" rx="8" class="head"/><text x="342" y="164" text-anchor="middle" class="h">Canal móvil</text><rect x="475" y="120" width="185" height="75" rx="8" class="head"/><text x="567" y="164" text-anchor="middle" class="h">API Gateway</text><rect x="700" y="120" width="185" height="75" rx="8" class="head"/><text x="792" y="164" text-anchor="middle" class="h">Identidad</text><rect x="925" y="120" width="185" height="75" rx="8" class="core"/><text x="1017" y="164" text-anchor="middle" class="h">Reportes</text><rect x="1150" y="120" width="200" height="75" rx="8" class="core"/><text x="1250" y="155" text-anchor="middle" class="h">Persistencia</text><text x="1250" y="180" text-anchor="middle" class="p">Microservicio</text><rect x="1390" y="120" width="200" height="75" rx="8" class="data"/><text x="1490" y="155" text-anchor="middle" class="h">Supabase</text><text x="1490" y="180" text-anchor="middle" class="p">PostgreSQL + Storage</text><rect x="1630" y="120" width="190" height="75" rx="8" class="infra"/><text x="1725" y="155" text-anchor="middle" class="h">RabbitMQ</text><text x="1725" y="180" text-anchor="middle" class="p">Exchange y colas</text><rect x="1860" y="120" width="215" height="75" rx="8" class="infra"/><text x="1967" y="153" text-anchor="middle" class="h">Consumidores</text><text x="1967" y="174" text-anchor="middle" class="p">Atención, avisos,</text><text x="1967" y="191" text-anchor="middle" class="p">indicadores y auditoría</text></g>
<g><line x1="117" y1="195" x2="117" y2="1320" class="life"/><line x1="342" y1="195" x2="342" y2="1320" class="life"/><line x1="567" y1="195" x2="567" y2="1320" class="life"/><line x1="792" y1="195" x2="792" y2="1320" class="life"/><line x1="1017" y1="195" x2="1017" y2="1320" class="life"/><line x1="1250" y1="195" x2="1250" y2="1320" class="life"/><line x1="1490" y1="195" x2="1490" y2="1320" class="life"/><line x1="1725" y1="195" x2="1725" y2="1320" class="life"/><line x1="1967" y1="195" x2="1967" y2="1320" class="life"/></g>
<g class="p"><text x="165" y="250">1. Completa reporte y evidencia</text><path d="M117 262H342" class="a"/><text x="375" y="335">2. Envía solicitud y Correlation ID</text><path d="M342 347H567" class="a"/><text x="610" y="420">3. Autentica y autoriza</text><path d="M567 432H792" class="a"/><text x="610" y="492">4. Acceso autorizado</text><path d="M792 504H567" class="r"/><text x="700" y="577">5. Registra corte</text><path d="M567 589H1017" class="a"/><rect x="940" y="625" width="155" height="65" rx="8" class="core"/><text x="1017" y="653" text-anchor="middle">6. Valida reglas</text><text x="1017" y="677" text-anchor="middle">y datos mínimos</text><text x="1050" y="745">7. guardarReporte y guardarEvidencia</text><path d="M1017 757H1250" class="a"/><text x="1290" y="830">8. Transacción + Outbox</text><path d="M1250 842H1490" class="a"/><text x="1305" y="902">9. Commit confirmado</text><path d="M1490 914H1250" class="r"/><text x="1060" y="974">10. Código y estado persistidos</text><path d="M1250 986H1017" class="r"/><text x="1300" y="1050">11. Publica evento confirmado</text><path d="M1017 1062H1725" class="g"/><text x="1770" y="1122">12. Entrega a consumidores</text><path d="M1725 1134H1967" class="g"/><text x="690" y="1195">13. Reporte aceptado y código de seguimiento</text><path d="M1017 1207H567" class="r"/><path d="M567 1260H342" class="r"/><path d="M342 1305H117" class="r"/><text x="180" y="1290">14. Confirmación visible</text></g><rect x="70" y="1350" width="1960" height="42" rx="8" fill="#fde7e7" stroke="#c94b4b"/><text x="1050" y="1377" text-anchor="middle" class="p">Logs, métricas y trazas usan el mismo identificador de correlación durante toda la transacción.</text></svg>
