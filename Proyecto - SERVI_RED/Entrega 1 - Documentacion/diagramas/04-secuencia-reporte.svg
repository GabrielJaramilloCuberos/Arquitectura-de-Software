  </g><line x1="570" y1="195" x2="570" y2="1305" stroke="#6B7C8F" stroke-width="1.5" stroke-dasharray="7 7"/><g>
    <rect x="720" y="120" width="180" height="75" rx="8" fill="#FFFFFF" stroke="#2F75B5" stroke-width="2"/>
    <text x="810" y="164.5" text-anchor="middle" class="boxTitle" fill="#17365D">Identidad</text>
    
  </g><line x1="810" y1="195" x2="810" y2="1305" stroke="#6B7C8F" stroke-width="1.5" stroke-dasharray="7 7"/><g>
    <rect x="960" y="120" width="180" height="75" rx="8" fill="#D9EAF7" stroke="#17365D" stroke-width="2"/>
    <text x="1050" y="164.5" text-anchor="middle" class="boxTitle" fill="#17365D">Reportes</text>
    
  </g><line x1="1050" y1="195" x2="1050" y2="1305" stroke="#6B7C8F" stroke-width="1.5" stroke-dasharray="7 7"/><g>
    <rect x="1200" y="120" width="180" height="75" rx="8" fill="#FFFFFF" stroke="#2F75B5" stroke-width="2"/>
    <text x="1290" y="164.5" text-anchor="middle" class="boxTitle" fill="#17365D">Geografía</text>
    
  </g><line x1="1290" y1="195" x2="1290" y2="1305" stroke="#6B7C8F" stroke-width="1.5" stroke-dasharray="7 7"/><g>
    <rect x="1440" y="120" width="180" height="75" rx="8" fill="#FFFFFF" stroke="#2F75B5" stroke-width="2"/>
    <text x="1530" y="164.5" text-anchor="middle" class="boxTitle" fill="#17365D">Evidencias</text>
    
  </g><line x1="1530" y1="195" x2="1530" y2="1305" stroke="#6B7C8F" stroke-width="1.5" stroke-dasharray="7 7"/><g>
    <rect x="1680" y="120" width="180" height="75" rx="8" fill="#FFFFFF" stroke="#2F75B5" stroke-width="2"/>
    <text x="1770" y="151" text-anchor="middle" class="boxTitle" fill="#17365D">Atención / efectos</text>
    <text x="1770" y="180" text-anchor="middle" class="body"><tspan x="1770" dy="0">Avisos y auditoría</tspan></text>
  </g><line x1="1770" y1="195" x2="1770" y2="1305" stroke="#6B7C8F" stroke-width="1.5" stroke-dasharray="7 7"/><g><line x1="100" y1="255" x2="330" y2="255" stroke="#2F75B5" stroke-width="2.4"  marker-end="url(#arrowBlue)"/><text x="215" y="245" text-anchor="middle" class="edge">1. Completa reporte y evidencia</text></g><g><line x1="330" y1="340" x2="570" y2="340" stroke="#2F75B5" stroke-width="2.4"  marker-end="url(#arrowBlue)"/><text x="450" y="330" text-anchor="middle" class="edge">2. Envía reporte + correlación</text></g><g><line x1="570" y1="425" x2="810" y2="425" stroke="#2F75B5" stroke-width="2.4"  marker-end="url(#arrowBlue)"/><text x="690" y="415" text-anchor="middle" class="edge">3. Autentica y solicita autorización</text></g><g><line x1="810" y1="500" x2="570" y2="500" stroke="#6B7C8F" stroke-width="2.4" stroke-dasharray="8 6" marker-end="url(#arrow)"/><text x="690" y="490" text-anchor="middle" class="edge">4. Acceso autorizado</text></g><g><line x1="570" y1="585" x2="1050" y2="585" stroke="#2F75B5" stroke-width="2.4"  marker-end="url(#arrowBlue)"/><text x="810" y="575" text-anchor="middle" class="edge">5. Registrar corte</text></g><g><line x1="1050" y1="670" x2="1290" y2="670" stroke="#2F75B5" stroke-width="2.4"  marker-end="url(#arrowBlue)"/><text x="1170" y="660" text-anchor="middle" class="edge">6. Validar ubicación y operador</text></g><g><line x1="1290" y1="745" x2="1050" y2="745" stroke="#6B7C8F" stroke-width="2.4" stroke-dasharray="8 6" marker-end="url(#arrow)"/><text x="1170" y="735" text-anchor="middle" class="edge">7. Territorio y responsable</text></g><g><line x1="1050" y1="830" x2="1530" y2="830" stroke="#2F75B5" stroke-width="2.4"  marker-end="url(#arrowBlue)"/><text x="1290" y="820" text-anchor="middle" class="edge">8. Guardar evidencia protegida</text></g><g><line x1="1530" y1="905" x2="1050" y2="905" stroke="#6B7C8F" stroke-width="2.4" stroke-dasharray="8 6" marker-end="url(#arrow)"/><text x="1290" y="895" text-anchor="middle" class="edge">9. Referencia de evidencia</text></g><rect x="960" y="945" width="180" height="70" rx="10" fill="#D9EAF7" stroke="#17365D" stroke-width="2"/><text x="1050" y="974" text-anchor="middle" class="small">10. Validar, crear</text><text x="1050" y="996" text-anchor="middle" class="small">y asignar código</text><g><line x1="1050" y1="1065" x2="1770" y2="1065" stroke="#2F75B5" stroke-width="2.4"  marker-end="url(#arrowBlue)"/><text x="1410" y="1055" text-anchor="middle" class="edge">11. Caso + aviso + auditoría</text></g><g><line x1="1050" y1="1150" x2="570" y2="1150" stroke="#6B7C8F" stroke-width="2.4" stroke-dasharray="8 6" marker-end="url(#arrow)"/><text x="810" y="1140" text-anchor="middle" class="edge">12. Reporte aceptado</text></g><g><line x1="570" y1="1235" x2="330" y2="1235" stroke="#6B7C8F" stroke-width="2.4" stroke-dasharray="8 6" marker-end="url(#arrow)"/><text x="450" y="1225" text-anchor="middle" class="edge">13. Código de seguimiento</text></g><g><line x1="330" y1="1320" x2="100" y2="1320" stroke="#6B7C8F" stroke-width="2.4" stroke-dasharray="8 6" marker-end="url(#arrow)"/><text x="215" y="1310" text-anchor="middle" class="edge">14. Confirmación visible</text></g><rect x="110" y="1360" width="1880" height="40" rx="8" fill="#F7E4E4"/><text x="1050" y="1386" text-anchor="middle" class="body">Observabilidad correlaciona latencia, errores y resultados durante toda la transacción.</text></svg>