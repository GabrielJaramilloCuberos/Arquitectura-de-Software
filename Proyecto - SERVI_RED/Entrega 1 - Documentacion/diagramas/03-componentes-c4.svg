<svg xmlns="http://www.w3.org/2000/svg" width="1900" height="1300" viewBox="0 0 1900 1300"><defs><style>.t{font:700 34px Arial;fill:#173a64}.s{font:18px Arial;fill:#52677e}.h{font:700 18px Arial;fill:#1f2937}.p{font:15px Arial;fill:#334155}.box{fill:#fff;stroke:#2876c7;stroke-width:2}.core{fill:#dcecf9;stroke:#173a64;stroke-width:3}.infra{fill:#e2f2e9;stroke:#34845d;stroke-width:2}.data{fill:#eee6f5;stroke:#76509a;stroke-width:2}.a{stroke:#667f99;stroke-width:2.5;fill:none;marker-end:url(#m)}.g{stroke:#34845d;stroke-width:2.5;fill:none;marker-end:url(#mg)}</style><marker id="m" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L9 3 0 6Z" fill="#667f99"/></marker><marker id="mg" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L9 3 0 6Z" fill="#34845d"/></marker></defs><rect width="1900" height="1300" fill="#f7fafc"/><text x="950" y="50" text-anchor="middle" class="t">Gestión de Reportes - Diagrama de Componentes (C4 Nivel 3)</text><text x="950" y="82" text-anchor="middle" class="s">Recepción, validación, persistencia centralizada y publicación de eventos</text><rect x="270" y="130" width="1190" height="1090" rx="20" fill="#eaf3fa" stroke="#173a64" stroke-width="3"/><text x="305" y="175" class="h">Microservicio Gestión de Reportes</text>
<rect x="35" y="245" width="190" height="110" rx="12" class="core"/><text x="130" y="288" text-anchor="middle" class="h">API Gateway</text><text x="130" y="325" text-anchor="middle" class="p">Invoca la API</text><rect x="345" y="245" width="330" height="115" rx="12" class="box"/><text x="510" y="288" text-anchor="middle" class="h">Controlador de reportes</text><text x="510" y="325" text-anchor="middle" class="p">Comandos, consultas y correlación</text><path d="M225 300H345" class="a"/><rect x="805" y="245" width="330" height="115" rx="12" class="box"/><text x="970" y="288" text-anchor="middle" class="h">Validador</text><text x="970" y="325" text-anchor="middle" class="p">Campos, servicio, tiempo y ubicación</text><path d="M675 300H805" class="a"/><rect x="345" y="460" width="330" height="120" rx="12" class="box"/><text x="510" y="505" text-anchor="middle" class="h">Gestor del ciclo de vida</text><text x="510" y="540" text-anchor="middle" class="p">Creación, estado y restablecimiento</text><path d="M510 360V460" class="a"/><rect x="805" y="460" width="330" height="120" rx="12" class="box"/><text x="970" y="505" text-anchor="middle" class="h">Gestor de evidencia</text><text x="970" y="540" text-anchor="middle" class="p">Valida fotografías y adjuntos</text><path d="M675 520H805" class="a"/>
<rect x="345" y="690" width="790" height="140" rx="14" class="core"/><text x="740" y="735" text-anchor="middle" class="h">Cliente del microservicio de Persistencia</text><text x="740" y="770" text-anchor="middle" class="p">Contratos versionados, idempotencia, timeouts y reintentos controlados</text><text x="740" y="800" text-anchor="middle" class="p">No contiene SQL, credenciales de Supabase ni conocimiento de tablas</text><path d="M510 580L620 690" class="a"/><path d="M970 580L860 690" class="a"/><rect x="520" y="930" width="440" height="120" rx="13" class="infra"/><text x="740" y="975" text-anchor="middle" class="h">Productor de eventos</text><text x="740" y="1010" text-anchor="middle" class="p">Publica después de confirmar la persistencia</text><path d="M740 830V930" class="g"/>
<rect x="1510" y="360" width="340" height="145" rx="14" class="core"/><text x="1680" y="405" text-anchor="middle" class="h">Microservicio de Persistencia</text><text x="1680" y="440" text-anchor="middle" class="p">Transacciones, integridad, migraciones</text><text x="1680" y="470" text-anchor="middle" class="p">y registro Transactional Outbox</text><path d="M1135 760L1510 440" class="a"/><rect x="1510" y="610" width="340" height="145" rx="14" class="data"/><text x="1680" y="655" text-anchor="middle" class="h">Supabase</text><text x="1680" y="690" text-anchor="middle" class="p">PostgreSQL + Storage</text><text x="1680" y="720" text-anchor="middle" class="p">Datos y evidencias protegidas</text><path d="M1680 505V610" class="a"/><rect x="1510" y="880" width="340" height="135" rx="14" class="infra"/><text x="1680" y="925" text-anchor="middle" class="h">RabbitMQ</text><text x="1680" y="960" text-anchor="middle" class="p">Exchange Topic, colas y reintentos</text><path d="M960 990H1510" class="g"/></svg>
