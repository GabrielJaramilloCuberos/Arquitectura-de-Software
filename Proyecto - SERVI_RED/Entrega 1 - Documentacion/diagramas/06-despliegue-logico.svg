<svg xmlns="http://www.w3.org/2000/svg" width="1900" height="1400" viewBox="0 0 1900 1400">
  <defs><style>.title{font:700 34px Arial;fill:#173a64}.sub{font:18px Arial;fill:#52677e}.zone{font:700 19px Arial;fill:#173a64}.box{fill:#fff;stroke:#173a64;stroke-width:2}.app{fill:#dcecf9;stroke:#173a64;stroke-width:2}.edge{fill:#fff;stroke:#d99a00;stroke-width:2}.data{fill:#eee6f5;stroke:#76509a;stroke-width:2}.manage{fill:#fde7e7;stroke:#c94b4b;stroke-width:2}.txt{font:700 18px Arial;fill:#1f2937}.small{font:15px Arial;fill:#334155}.arrow{stroke:#667f99;stroke-width:2.5;fill:none;marker-end:url(#a)}.dash{stroke:#c94b4b;stroke-width:2;stroke-dasharray:7 6;fill:none;marker-end:url(#r)}</style><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0 L9 3 L0 6Z" fill="#667f99"/></marker><marker id="r" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0 L9 3 L0 6Z" fill="#c94b4b"/></marker></defs>
  <rect width="1900" height="1400" fill="#f7fafc"/><text x="950" y="48" text-anchor="middle" class="title">SERVI-RED - Diagrama de Despliegue Lógico</text><text x="950" y="80" text-anchor="middle" class="sub">Zonas de ejecución, microservicio de persistencia y Supabase administrado</text>
  <rect x="30" y="110" width="1840" height="170" rx="18" fill="#e2f2e9" stroke="#34845d" stroke-width="2"/><text x="55" y="145" class="zone">1. Dispositivos y navegadores</text><rect x="120" y="175" width="320" height="70" rx="10" class="box"/><text x="280" y="217" text-anchor="middle" class="txt">Dispositivo ciudadano</text><rect x="790" y="175" width="320" height="70" rx="10" class="box"/><text x="950" y="217" text-anchor="middle" class="txt">Navegador operador</text><rect x="1460" y="175" width="320" height="70" rx="10" class="box"/><text x="1620" y="217" text-anchor="middle" class="txt">Navegador público</text>
  <rect x="30" y="320" width="1840" height="170" rx="18" fill="#f4f7fa" stroke="#d99a00" stroke-width="2"/><text x="55" y="355" class="zone">2. Zona de acceso controlado</text><rect x="235" y="390" width="570" height="70" rx="10" class="edge"/><text x="520" y="432" text-anchor="middle" class="txt">Punto de entrada, protección y fachada API</text><rect x="1095" y="390" width="570" height="70" rx="10" class="edge"/><text x="1380" y="432" text-anchor="middle" class="txt">Distribución de contenido público</text><path d="M280 245 L440 390" class="arrow"/><path d="M950 245 L600 390" class="arrow"/><path d="M1620 245 L1450 390" class="arrow"/>
  <rect x="30" y="530" width="1840" height="360" rx="18" fill="#e4f0fa" stroke="#173a64" stroke-width="2"/><text x="55" y="565" class="zone">3. Zona de aplicaciones escalable</text><rect x="90" y="620" width="430" height="105" rx="12" class="box"/><text x="305" y="658" text-anchor="middle" class="txt">Microservicios de negocio</text><text x="305" y="690" text-anchor="middle" class="small">Identidad, reportes, atención, geografía</text><rect x="90" y="760" width="430" height="90" rx="12" class="box"/><text x="305" y="798" text-anchor="middle" class="txt">Trabajadores de eventos</text><text x="305" y="828" text-anchor="middle" class="small">Avisos, indicadores e integraciones</text><rect x="700" y="650" width="490" height="150" rx="14" class="app"/><text x="945" y="695" text-anchor="middle" class="txt">Microservicio de Persistencia</text><text x="945" y="730" text-anchor="middle" class="small">API interna · validación técnica · repositorios</text><text x="945" y="760" text-anchor="middle" class="small">Réplicas sin estado, pool de conexiones e idempotencia</text><rect x="1390" y="650" width="390" height="150" rx="14" class="app"/><text x="1585" y="695" text-anchor="middle" class="txt">Bus de eventos</text><text x="1585" y="730" text-anchor="middle" class="small">Entrega, reintentos y consumidores</text><text x="1585" y="760" text-anchor="middle" class="small">Publicación mediante Outbox</text><path d="M520 425 L305 620" class="arrow"/><path d="M305 725 V760" class="arrow"/><path d="M520 673 H700" class="arrow"/><path d="M520 805 H700" class="arrow"/><path d="M1190 725 H1390" class="arrow"/>
  <rect x="30" y="930" width="1190" height="300" rx="18" fill="#f1ebf7" stroke="#76509a" stroke-width="2"/><text x="55" y="965" class="zone">4. Plataforma administrada de datos: Supabase</text><rect x="130" y="1025" width="430" height="130" rx="14" class="data"/><text x="345" y="1070" text-anchor="middle" class="txt">PostgreSQL administrado</text><text x="345" y="1105" text-anchor="middle" class="small">Reportes, estados, asignaciones, auditoría</text><rect x="690" y="1025" width="430" height="130" rx="14" class="data"/><text x="905" y="1070" text-anchor="middle" class="txt">Supabase Storage</text><text x="905" y="1105" text-anchor="middle" class="small">Evidencias y adjuntos protegidos</text><path d="M850 800 L345 1025" class="arrow"/><path d="M1040 800 L905 1025" class="arrow"/><text x="625" y="910" text-anchor="middle" class="small">Único acceso autorizado a datos persistentes</text>
  <rect x="1270" y="930" width="600" height="300" rx="18" fill="#fceded" stroke="#c94b4b" stroke-width="2"/><text x="1295" y="965" class="zone">5. Zona de gestión y seguridad</text><rect x="1350" y="1015" width="440" height="75" rx="10" class="manage"/><text x="1570" y="1060" text-anchor="middle" class="txt">Logs, métricas, trazas y alertas</text><rect x="1350" y="1120" width="440" height="75" rx="10" class="manage"/><text x="1570" y="1165" text-anchor="middle" class="txt">Identidades, políticas y secretos</text><path d="M1570 1015 V870 H945 V800" class="dash"/><path d="M1350 1158 H1245 V725 H1190" class="dash"/>
  <rect x="370" y="1290" width="1160" height="70" rx="12" class="edge"/><text x="950" y="1320" text-anchor="middle" class="txt">Sistemas externos</text><text x="950" y="1347" text-anchor="middle" class="small">Operadores · reguladores · cartografía · canales de notificación</text><path d="M1585 800 L1450 1290" class="arrow"/>
</svg>
