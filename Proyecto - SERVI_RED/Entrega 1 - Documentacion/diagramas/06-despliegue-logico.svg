<svg xmlns="http://www.w3.org/2000/svg" width="1900" height="1400" viewBox="0 0 1900 1400"><defs><style>.t{font:700 34px Arial;fill:#173a64}.s{font:18px Arial;fill:#52677e}.z{font:700 19px Arial;fill:#173a64}.h{font:700 18px Arial;fill:#1f2937}.p{font:15px Arial;fill:#334155}.box{fill:#fff;stroke:#173a64;stroke-width:2}.app{fill:#dcecf9;stroke:#173a64;stroke-width:2}.edge{fill:#fff;stroke:#d99a00;stroke-width:2}.data{fill:#eee6f5;stroke:#76509a;stroke-width:2}.manage{fill:#fde7e7;stroke:#c94b4b;stroke-width:2}.mq{fill:#e2f2e9;stroke:#34845d;stroke-width:2}.a{stroke:#667f99;stroke-width:2.5;fill:none;marker-end:url(#m)}.d{stroke:#c94b4b;stroke-width:2;stroke-dasharray:7 6;fill:none;marker-end:url(#mr)}</style><marker id="m" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L9 3 0 6Z" fill="#667f99"/></marker><marker id="mr" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L9 3 0 6Z" fill="#c94b4b"/></marker></defs><rect width="1900" height="1400" fill="#f7fafc"/><text x="950" y="48" text-anchor="middle" class="t">SERVI-RED - Diagrama de Despliegue</text><text x="950" y="80" text-anchor="middle" class="s">Plataforma SaaS con servicios escalables, RabbitMQ y Supabase administrado</text>
<rect x="30" y="110" width="1840" height="170" rx="18" fill="#e2f2e9" stroke="#34845d" stroke-width="2"/><text x="55" y="145" class="z">1. Dispositivos cliente</text><rect x="120" y="175" width="420" height="70" rx="10" class="box"/><text x="330" y="217" text-anchor="middle" class="h">Aplicación móvil ciudadana</text><rect x="740" y="175" width="420" height="70" rx="10" class="box"/><text x="950" y="217" text-anchor="middle" class="h">Navegador del operador</text><rect x="1360" y="175" width="420" height="70" rx="10" class="box"/><text x="1570" y="217" text-anchor="middle" class="h">Navegador público</text>
<rect x="30" y="320" width="1840" height="170" rx="18" fill="#f4f7fa" stroke="#d99a00" stroke-width="2"/><text x="55" y="355" class="z">2. Zona de acceso</text><rect x="320" y="390" width="1260" height="70" rx="10" class="edge"/><text x="950" y="432" text-anchor="middle" class="h">Balanceador / API Gateway - TLS, autenticación, enrutamiento y control de carga</text><path d="M330 245L620 390" class="a"/><path d="M950 245V390" class="a"/><path d="M1570 245L1280 390" class="a"/>
<rect x="30" y="530" width="1840" height="420" rx="18" fill="#e4f0fa" stroke="#173a64" stroke-width="2"/><text x="55" y="565" class="z">3. Zona de aplicaciones escalable</text><rect x="80" y="625" width="510" height="135" rx="13" class="app"/><text x="335" y="668" text-anchor="middle" class="h">Microservicios de negocio</text><text x="335" y="703" text-anchor="middle" class="p">Identidad, Reportes, Atención, Moderación,</text><text x="335" y="733" text-anchor="middle" class="p">Notificaciones, Indicadores y Auditoría</text><rect x="695" y="625" width="510" height="135" rx="13" class="app"/><text x="950" y="668" text-anchor="middle" class="h">Microservicio de Persistencia</text><text x="950" y="703" text-anchor="middle" class="p">Varias réplicas sin estado y pool de conexiones</text><text x="950" y="733" text-anchor="middle" class="p">API interna, integridad, migraciones y Outbox</text><rect x="1310" y="625" width="480" height="135" rx="13" class="mq"/><text x="1550" y="668" text-anchor="middle" class="h">RabbitMQ</text><text x="1550" y="703" text-anchor="middle" class="p">Exchange Topic, colas persistentes</text><text x="1550" y="733" text-anchor="middle" class="p">reintentos y control de duplicados</text><path d="M950 460L335 625" class="a"/><path d="M590 692H695" class="a"/><path d="M1205 692H1310" class="a"/><rect x="350" y="825" width="1200" height="75" rx="11" class="box"/><text x="950" y="855" text-anchor="middle" class="h">Despliegue independiente y escalamiento por capacidad</text><text x="950" y="882" text-anchor="middle" class="p">Los consumidores se recuperan sin bloquear el registro de reportes.</text>
<rect x="30" y="990" width="1160" height="300" rx="18" fill="#f1ebf7" stroke="#76509a" stroke-width="2"/><text x="55" y="1025" class="z">4. Supabase - plataforma administrada de datos</text><rect x="115" y="1080" width="450" height="135" rx="13" class="data"/><text x="340" y="1125" text-anchor="middle" class="h">PostgreSQL administrado</text><text x="340" y="1160" text-anchor="middle" class="p">Usuarios, reportes, casos, indicadores y auditoría</text><rect x="655" y="1080" width="450" height="135" rx="13" class="data"/><text x="880" y="1125" text-anchor="middle" class="h">Supabase Storage</text><text x="880" y="1160" text-anchor="middle" class="p">Fotografías y evidencias protegidas</text><path d="M860 760L340 1080" class="a"/><path d="M1040 760L880 1080" class="a"/>
<rect x="1240" y="990" width="630" height="300" rx="18" fill="#fceded" stroke="#c94b4b" stroke-width="2"/><text x="1265" y="1025" class="z">5. Operación y seguridad</text><rect x="1330" y="1080" width="450" height="75" rx="10" class="manage"/><text x="1555" y="1125" text-anchor="middle" class="h">Logs, métricas, trazas y alertas</text><rect x="1330" y="1190" width="450" height="75" rx="10" class="manage"/><text x="1555" y="1235" text-anchor="middle" class="h">Identidades, políticas y secretos</text><path d="M1555 1080V930H950V760" class="d"/><path d="M1330 1227H1240V720H1205" class="d"/><text x="950" y="1350" text-anchor="middle" class="s">Solo las réplicas de Persistencia reciben credenciales privilegiadas de Supabase.</text></svg>
