<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="1080" viewBox="0 0 1700 1080">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#17365D" flood-opacity="0.14"/></filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#6B7F93"/></marker>
    <style>.title{font:700 34px Arial;fill:#17365D}.subtitle{font:18px Arial;fill:#536577}.boxTitle{font:700 21px Arial;fill:#202A35}.body{font:16px Arial;fill:#293747}.label{font:700 14px Arial;fill:#536577}.boundary{font:700 18px Arial;fill:#17365D}</style>
  </defs>
  <rect width="1700" height="1080" fill="#F6F9FC"/>
  <text x="850" y="55" text-anchor="middle" class="title">SERVI-RED - Diagrama de Contexto (C4 Nivel 1)</text>
  <text x="850" y="86" text-anchor="middle" class="subtitle">La persistencia se centraliza internamente y Supabase es la plataforma administrada de datos</text>
  <g filter="url(#shadow)" fill="#E3F2E8" stroke="#2E7D57" stroke-width="2"><rect x="55" y="150" width="295" height="115" rx="16"/><rect x="55" y="330" width="295" height="115" rx="16"/><rect x="55" y="510" width="295" height="115" rx="16"/><rect x="55" y="690" width="295" height="115" rx="16"/></g>
  <text x="202" y="188" text-anchor="middle" class="boxTitle">Ciudadano</text><text x="202" y="220" text-anchor="middle" class="body">Reporta y consulta novedades</text>
  <text x="202" y="368" text-anchor="middle" class="boxTitle">Operador</text><text x="202" y="400" text-anchor="middle" class="body">Atiende y cierra casos</text>
  <text x="202" y="548" text-anchor="middle" class="boxTitle">Regulador</text><text x="202" y="580" text-anchor="middle" class="body">Fiscaliza y exporta datos</text>
  <text x="202" y="728" text-anchor="middle" class="boxTitle">Público / Academia</text><text x="202" y="760" text-anchor="middle" class="body">Consulta indicadores abiertos</text>
  <g filter="url(#shadow)"><rect x="510" y="285" width="680" height="360" rx="22" fill="#D5E8F7" stroke="#17365D" stroke-width="3"/></g>
  <text x="850" y="340" text-anchor="middle" class="boxTitle">SERVI-RED</text><text x="850" y="378" text-anchor="middle" class="body">Plataforma colaborativa de reporte, monitoreo e indicadores</text>
  <rect x="590" y="425" width="520" height="145" rx="16" fill="#FFFFFF" stroke="#2E74B5" stroke-width="2"/>
  <text x="850" y="465" text-anchor="middle" class="boundary">Flujo interno de persistencia</text><text x="850" y="505" text-anchor="middle" class="body">Microservicios de negocio → Microservicio de Persistencia</text><text x="850" y="540" text-anchor="middle" class="body">Ningún otro componente accede directamente a Supabase</text>
  <g filter="url(#shadow)" fill="#FFF7E5" stroke="#E4A000" stroke-width="2"><rect x="1350" y="130" width="300" height="105" rx="16"/><rect x="1350" y="280" width="300" height="105" rx="16"/><rect x="1350" y="430" width="300" height="105" rx="16"/><rect x="1350" y="580" width="300" height="105" rx="16"/></g>
  <text x="1500" y="168" text-anchor="middle" class="boxTitle">Sistemas de operadores</text><text x="1500" y="201" text-anchor="middle" class="body">Intercambian casos</text>
  <text x="1500" y="318" text-anchor="middle" class="boxTitle">Plataformas regulatorias</text><text x="1500" y="351" text-anchor="middle" class="body">Reciben información</text>
  <text x="1500" y="468" text-anchor="middle" class="boxTitle">Canales de notificación</text><text x="1500" y="501" text-anchor="middle" class="body">Entregan confirmaciones</text>
  <text x="1500" y="618" text-anchor="middle" class="boxTitle">Cartografía abierta</text><text x="1500" y="651" text-anchor="middle" class="body">Referencia geográfica</text>
  <g filter="url(#shadow)"><rect x="590" y="830" width="520" height="155" rx="20" fill="#EDE3F4" stroke="#704090" stroke-width="3"/></g>
  <text x="850" y="875" text-anchor="middle" class="boxTitle">Supabase</text><text x="850" y="910" text-anchor="middle" class="body">PostgreSQL administrado + Storage de evidencias</text><text x="850" y="945" text-anchor="middle" class="body">Acceso exclusivo mediante el microservicio de Persistencia</text>
  <g fill="none" stroke="#6B7F93" stroke-width="2.3" marker-end="url(#arrow)"><path d="M350 208 L510 360"/><path d="M350 387 L510 420"/><path d="M350 567 L510 505"/><path d="M350 747 L510 565"/><path d="M1190 360 L1350 183"/><path d="M1190 420 L1350 333"/><path d="M1190 480 L1350 483"/><path d="M1190 540 L1350 633"/><path d="M850 645 L850 830"/></g>
  <text x="418" y="274" class="label">Reporta y consulta</text><text x="1210" y="335" class="label">Integra</text><text x="872" y="755" class="label">Persiste únicamente mediante Persistencia</text>
</svg>
