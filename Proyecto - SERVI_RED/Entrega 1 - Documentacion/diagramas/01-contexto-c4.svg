<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="1080" viewBox="0 0 1700 1080"><defs><style>.t{font:700 34px Arial;fill:#173a64}.s{font:18px Arial;fill:#52677e}.h{font:700 21px Arial;fill:#1f2937}.p{font:16px Arial;fill:#334155}.actor{fill:#e2f2e9;stroke:#34845d;stroke-width:2}.sys{fill:#dcecf9;stroke:#173a64;stroke-width:3}.ext{fill:#eee6f5;stroke:#76509a;stroke-width:2}.a{stroke:#667f99;stroke-width:2.5;fill:none;marker-end:url(#m)}</style><marker id="m" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L9 3 0 6Z" fill="#667f99"/></marker></defs><rect width="1700" height="1080" fill="#f7fafc"/><text x="850" y="55" text-anchor="middle" class="t">SERVI-RED - Diagrama de Contexto (C4 Nivel 1)</text><text x="850" y="88" text-anchor="middle" class="s">Actores definidos para la plataforma y servicio administrado de datos</text>
<g><rect x="65" y="160" width="330" height="130" rx="14" class="actor"/><text x="230" y="205" text-anchor="middle" class="h">Ciudadano</text><text x="230" y="240" text-anchor="middle" class="p">Reporta, consulta y valida eventos</text><rect x="65" y="355" width="330" height="130" rx="14" class="actor"/><text x="230" y="400" text-anchor="middle" class="h">Denunciante anónimo</text><text x="230" y="435" text-anchor="middle" class="p">Informa posibles fraudes</text><rect x="65" y="550" width="330" height="130" rx="14" class="actor"/><text x="230" y="595" text-anchor="middle" class="h">Operador de servicio</text><text x="230" y="630" text-anchor="middle" class="p">Prioriza, atiende y cierra casos</text><rect x="65" y="745" width="330" height="130" rx="14" class="actor"/><text x="230" y="790" text-anchor="middle" class="h">Público y academia</text><text x="230" y="825" text-anchor="middle" class="p">Consulta indicadores y datos abiertos</text></g>
<rect x="530" y="245" width="640" height="485" rx="20" class="sys"/><text x="850" y="315" text-anchor="middle" class="h">SERVI-RED</text><text x="850" y="355" text-anchor="middle" class="p">Plataforma web y móvil para registrar, monitorear y analizar</text><text x="850" y="385" text-anchor="middle" class="p">afectaciones de servicios públicos domiciliarios</text><rect x="625" y="460" width="450" height="145" rx="13" fill="#fff" stroke="#2876c7" stroke-width="2"/><text x="850" y="505" text-anchor="middle" class="h">Persistencia centralizada</text><text x="850" y="540" text-anchor="middle" class="p">Los microservicios usan una API interna</text><text x="850" y="575" text-anchor="middle" class="p">y no acceden directamente a Supabase</text>
<rect x="1300" y="325" width="330" height="180" rx="15" class="ext"/><text x="1465" y="375" text-anchor="middle" class="h">Supabase</text><text x="1465" y="415" text-anchor="middle" class="p">PostgreSQL para datos</text><text x="1465" y="448" text-anchor="middle" class="p">Storage para evidencias</text><rect x="1300" y="615" width="330" height="145" rx="15" fill="#fde7e7" stroke="#c94b4b" stroke-width="2"/><text x="1465" y="660" text-anchor="middle" class="h">Equipo de operación</text><text x="1465" y="700" text-anchor="middle" class="p">Supervisa salud, alertas y fallos</text>
