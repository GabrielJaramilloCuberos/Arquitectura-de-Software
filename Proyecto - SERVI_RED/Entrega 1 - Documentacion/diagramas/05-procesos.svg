    <text x="1520" y="551" text-anchor="middle" class="boxTitle" fill="#17365D">Integraciones</text>
    <text x="1520" y="580" text-anchor="middle" class="body"><tspan x="1520" dy="0">Operadores y reguladores</tspan></text>
  </g><g><path d="M1110,340 L1110,430 L320,430 L320,520" fill="none" stroke="#6B7C8F" stroke-width="2.3" marker-end="url(#arrow)"/>
    <text x="720" y="421" text-anchor="middle" class="edge">Evento aceptado</text></g><g><path d="M1110,430 L720,430 L720,520" fill="none" stroke="#6B7C8F" stroke-width="2.3" marker-end="url(#arrow)"/>
    </g><g><path d="M1110,430 L1120,520" fill="none" stroke="#6B7C8F" stroke-width="2.3" marker-end="url(#arrow)"/>
    </g><g><path d="M1110,430 L1520,430 L1520,520" fill="none" stroke="#6B7C8F" stroke-width="2.3" marker-end="url(#arrow)"/>
    </g><g filter="url(#shadow)">
    <rect x="110" y="800" width="720" height="140" rx="14" fill="#EEE7F3" stroke="#71538A" stroke-width="2"/>
    <text x="470" y="831" text-anchor="middle" class="boxTitle" fill="#17365D">Seguridad transversal</text>
    <text x="470" y="860" text-anchor="middle" class="body"><tspan x="470" dy="0">Autenticación · RBAC · cifrado · privacidad · auditoría</tspan></text>
  </g><g filter="url(#shadow)">
    <rect x="970" y="800" width="720" height="140" rx="14" fill="#F7E4E4" stroke="#A84242" stroke-width="2"/>
    <text x="1330" y="831" text-anchor="middle" class="boxTitle" fill="#17365D">Observabilidad transversal</text>
    <text x="1330" y="860" text-anchor="middle" class="body"><tspan x="1330" dy="0">Monitoreo de procesos · logs · métricas · trazas · alertas</tspan></text>
  </g><g><path d="M470,800 L470,730 L900,730 L900,645" fill="none" stroke="#6B7C8F" stroke-width="2.3" stroke-dasharray="8 6" marker-end="url(#arrow)"/>
    <text x="680" y="721" text-anchor="middle" class="edge">Controla todos los flujos</text></g><g><path d="M1330,800 L1330,730 L900,730 L900,645" fill="none" stroke="#A84242" stroke-width="2.3" stroke-dasharray="8 6" marker-end="url(#arrow)"/>
    <text x="1150" y="721" text-anchor="middle" class="edge">Observa todos los flujos</text></g></svg>