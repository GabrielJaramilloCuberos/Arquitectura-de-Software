<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1050" viewBox="0 0 1800 1050">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#17365D" flood-opacity="0.14"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6B7C8F"/></marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2F75B5"/></marker>
    <style>
      text{font-family:Arial,Helvetica,sans-serif;fill:#1D2733}
      .title{font-size:34px;font-weight:700;fill:#17365D}
      .subtitle{font-size:18px;fill:#536273}
      .boxTitle{font-size:20px;font-weight:700}
      .body{font-size:16px}
      .small{font-size:14px;fill:#536273}
      .edge{font-size:14px;font-weight:600;fill:#536273}
      .zone{font-size:20px;font-weight:700;fill:#17365D}
    </style>
  </defs>
  <rect width="1800" height="1050" fill="#F7FAFC"/>
  <text x="900" y="52" text-anchor="middle" class="title">SERVI-RED - Vista de Procesos</text>
  <text x="900" y="82" text-anchor="middle" class="subtitle">Separación entre camino crítico, trabajo desacoplado y capas transversales</text><text x="80" y="160" class="zone">Camino síncrono (el ciudadano espera)</text><g filter="url(#shadow)">
    <rect x="90" y="220" width="240" height="120" rx="14" fill="#D9EAF7" stroke="#17365D" stroke-width="2"/>
