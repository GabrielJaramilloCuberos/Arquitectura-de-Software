    <text x="510" y="280" text-anchor="middle" class="body"><tspan x="510" dy="0">y autorización</tspan></text>
  </g><g filter="url(#shadow)">
    <rect x="690" y="220" width="240" height="120" rx="14" fill="#D9EAF7" stroke="#17365D" stroke-width="2"/>
    <text x="810" y="251" text-anchor="middle" class="boxTitle" fill="#17365D">Validación</text>
    <text x="810" y="280" text-anchor="middle" class="body"><tspan x="810" dy="0">mínima</tspan></text>
  </g><g filter="url(#shadow)">
    <rect x="990" y="220" width="240" height="120" rx="14" fill="#D9EAF7" stroke="#17365D" stroke-width="2"/>
    <text x="1110" y="251" text-anchor="middle" class="boxTitle" fill="#17365D">Registro</text>
    <text x="1110" y="280" text-anchor="middle" class="body"><tspan x="1110" dy="0">transaccional</tspan></text>
  </g><g filter="url(#shadow)">
    <rect x="1290" y="220" width="240" height="120" rx="14" fill="#D9EAF7" stroke="#17365D" stroke-width="2"/>
    <text x="1410" y="251" text-anchor="middle" class="boxTitle" fill="#17365D">Confirmación</text>
    <text x="1410" y="280" text-anchor="middle" class="body"><tspan x="1410" dy="0">al ciudadano</tspan></text>
  </g><g>
    <path d="M330,280 L390,280" fill="none" stroke="#6B7C8F" stroke-width="2.3" marker-end="url(#arrow)"/>
    
  </g><g>
    <path d="M630,280 L690,280" fill="none" stroke="#6B7C8F" stroke-width="2.3" marker-end="url(#arrow)"/>
    
  </g><g>
    <path d="M930,280 L990,280" fill="none" stroke="#6B7C8F" stroke-width="2.3" marker-end="url(#arrow)"/>
    
  </g><g>
    <path d="M1230,280 L1290,280" fill="none" stroke="#6B7C8F" stroke-width="2.3" marker-end="url(#arrow)"/>
    
  </g><text x="80" y="455" class="zone">Procesamiento desacoplado (no bloquea el reporte)</text><g filter="url(#shadow)">
