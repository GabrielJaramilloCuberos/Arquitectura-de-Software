<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1080" viewBox="0 0 1800 1080">
  <defs><style>.title{font:700 34px Arial;fill:#173a64}.sub{font:18px Arial;fill:#52677e}.label{font:700 20px Arial;fill:#173a64}.box{fill:#dcecf9;stroke:#173a64;stroke-width:2}.async{fill:#e2f2e9;stroke:#34845d;stroke-width:2}.data{fill:#eee6f5;stroke:#76509a;stroke-width:2}.cross{fill:#fde7e7;stroke:#c94b4b;stroke-width:2}.txt{font:700 18px Arial;fill:#1f2937}.small{font:15px Arial;fill:#334155}.arrow{stroke:#667f99;stroke-width:2.5;fill:none;marker-end:url(#a)}.event{stroke:#34845d;stroke-width:2.5;fill:none;marker-end:url(#g)}.dash{stroke:#c94b4b;stroke-width:2;stroke-dasharray:7 6;fill:none;marker-end:url(#r)}</style><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0 L9 3 L0 6Z" fill="#667f99"/></marker><marker id="g" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0 L9 3 L0 6Z" fill="#34845d"/></marker><marker id="r" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0 L9 3 L0 6Z" fill="#c94b4b"/></marker></defs>
  <rect width="1800" height="1080" fill="#f7fafc"/><text x="900" y="55" text-anchor="middle" class="title">SERVI-RED - Vista de Procesos</text><text x="900" y="87" text-anchor="middle" class="sub">Camino crítico, persistencia centralizada y efectos desacoplados</text>
  <text x="55" y="140" class="label">Camino síncrono (el ciudadano espera confirmación)</text>
  <g><rect x="55" y="180" width="210" height="100" rx="13" class="box"/><text x="160" y="220" text-anchor="middle" class="txt">Recepción</text><text x="160" y="250" text-anchor="middle" class="small">Solicitud y correlación</text><rect x="315" y="180" width="210" height="100" rx="13" class="box"/><text x="420" y="220" text-anchor="middle" class="txt">Autenticación</text><text x="420" y="250" text-anchor="middle" class="small">RBAC y autorización</text><rect x="575" y="180" width="210" height="100" rx="13" class="box"/><text x="680" y="220" text-anchor="middle" class="txt">Reglas de negocio</text><text x="680" y="250" text-anchor="middle" class="small">Validación del reporte</text><rect x="835" y="180" width="230" height="100" rx="13" class="box"/><text x="950" y="220" text-anchor="middle" class="txt">Persistencia</text><text x="950" y="250" text-anchor="middle" class="small">API única e idempotente</text><rect x="1115" y="180" width="230" height="100" rx="13" class="data"/><text x="1230" y="220" text-anchor="middle" class="txt">Supabase</text><text x="1230" y="250" text-anchor="middle" class="small">PostgreSQL + Storage</text><rect x="1395" y="180" width="210" height="100" rx="13" class="box"/><text x="1500" y="220" text-anchor="middle" class="txt">Confirmación</text><text x="1500" y="250" text-anchor="middle" class="small">Código de seguimiento</text>
  <path d="M265 230 H315" class="arrow"/><path d="M525 230 H575" class="arrow"/><path d="M785 230 H835" class="arrow"/><path d="M1065 230 H1115" class="arrow"/><path d="M1345 230 H1395" class="arrow"/></g>
  <text x="55" y="370" class="label">Procesamiento desacoplado (no bloquea la respuesta)</text>
  <rect x="720" y="405" width="215" height="90" rx="12" class="async"/><text x="827" y="440" text-anchor="middle" class="txt">Outbox</text><text x="827" y="470" text-anchor="middle" class="small">Evento tras el commit</text><rect x="995" y="405" width="215" height="90" rx="12" class="async"/><text x="1102" y="440" text-anchor="middle" class="txt">Bus de eventos</text><text x="1102" y="470" text-anchor="middle" class="small">Entrega y reintentos</text><path d="M950 280 V350 H827 V405" class="event"/><path d="M935 450 H995" class="event"/>
  <g><rect x="100" y="580" width="280" height="105" rx="13" class="async"/><text x="240" y="620" text-anchor="middle" class="txt">Atención operacional</text><text x="240" y="652" text-anchor="middle" class="small">Asigna y prioriza casos</text><rect x="500" y="580" width="280" height="105" rx="13" class="async"/><text x="640" y="620" text-anchor="middle" class="txt">Notificaciones</text><text x="640" y="652" text-anchor="middle" class="small">Confirma y alerta</text><rect x="900" y="580" width="280" height="105" rx="13" class="async"/><text x="1040" y="620" text-anchor="middle" class="txt">Indicadores</text><text x="1040" y="652" text-anchor="middle" class="small">Actualiza agregados</text><rect x="1300" y="580" width="280" height="105" rx="13" class="async"/><text x="1440" y="620" text-anchor="middle" class="txt">Auditoría e integración</text><text x="1440" y="652" text-anchor="middle" class="small">Registra y publica</text>
  <path d="M1102 495 V535 H240 V580" class="event"/><path d="M1102 535 H640 V580" class="event"/><path d="M1102 535 H1040 V580" class="event"/><path d="M1102 535 H1440 V580" class="event"/></g>
  <rect x="70" y="805" width="760" height="165" rx="15" class="data"/><text x="450" y="850" text-anchor="middle" class="txt">Seguridad transversal</text><text x="450" y="890" text-anchor="middle" class="small">Autenticación · RBAC · cifrado · secretos · auditoría</text><text x="450" y="925" text-anchor="middle" class="small">Las credenciales privilegiadas de Supabase solo pertenecen a Persistencia.</text>
  <rect x="970" y="805" width="760" height="165" rx="15" class="cross"/><text x="1350" y="850" text-anchor="middle" class="txt">Observabilidad transversal</text><text x="1350" y="890" text-anchor="middle" class="small">Procesos · logs · métricas · trazas · alertas</text><text x="1350" y="925" text-anchor="middle" class="small">Incluye salud y saturación del microservicio de Persistencia y Supabase.</text>
  <path d="M450 805 V745 H950 V280" class="arrow"/><path d="M1350 805 V745 H1102 V495" class="dash"/>
  <text x="900" y="1030" text-anchor="middle" class="sub">Ningún microservicio de negocio accede directamente a Supabase.</text>
