    <text x="720" y="580" text-anchor="middle" class="body"><tspan x="720" dy="0">Confirmar y avisar</tspan></text>
  </g><g filter="url(#shadow)">
    <rect x="990" y="520" width="260" height="125" rx="14" fill="#E2F0E8" stroke="#3E7D5B" stroke-width="2"/>
