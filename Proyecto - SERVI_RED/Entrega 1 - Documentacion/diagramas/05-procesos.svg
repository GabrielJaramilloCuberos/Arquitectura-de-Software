    <text x="210" y="280" text-anchor="middle" class="body"><tspan x="210" dy="0">Solicitud</tspan></text>
  </g><g filter="url(#shadow)">
    <rect x="390" y="220" width="240" height="120" rx="14" fill="#D9EAF7" stroke="#17365D" stroke-width="2"/>
